[package]
name = "ArgentumCoopBevy"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18", features = [
    "dynamic_linking",
    "track_location",
    "serialize",
    "jpeg",
] }

#vec-collections = "0.4.3"
debug_unwraps = "0.1.0"
rand = "0.9.2"
rand_distr = "0.5.1"
rand_seeder = "*"
rand_pcg = "*"

bevy_simple_scroll_view = "0.4.0"
bevy_replicon = "0.38.2"
bevy_replicon_renet = "0.14"
bevy-inspector-egui = "0.36.0"

serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
bevy-fps-counter = "0.9.0"

#log = { version = "*", features = ["max_level_debug", "release_max_level_warn"] } # Improve Runtime Performance (Optional) 

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3


